services:
  - type: web
    name: food-delivery-dashboard
    runtime: python
    region: singapore
    plan: free
    buildCommand: >
      pip install -r api/requirements.txt &&
      cd ui && npm install && npm run build
    startCommand: python3.11 -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.11.0
